global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    app: "orizon"
    environment: "development"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "orizon-api"
    static_configs:
      - targets: ["host.docker.internal:5010"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  - job_name: "orizon-worker"
    static_configs:
      - targets: ["host.docker.internal:5011"]
    metrics_path: "/metrics"
    scrape_interval: 15s